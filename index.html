<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IPO Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F1F5F9; --card-bg: #FFFFFF; --text-primary: #0F172A; --text-secondary: #64748B;
            --border: #E2E8F0; --gain-bg: #D1FAE5; --gain-text: #065F46;
            --loss-bg: #FEE2E2; --loss-text: #991B1B; --sme-bg: #FEF3C7; --sme-text: #92400E;
            --main-bg: #DBEAFE; --main-text: #1E40AF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: var(--bg); color: var(--text-primary); padding: 2rem 1.5rem; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .header h1 { font-size: 1.875rem; font-weight: 800; letter-spacing: -0.02em; }
        .header .upd { font-size: 0.875rem; color: var(--text-secondary); font-weight: 500; }
        
        .section { margin-bottom: 3rem; }
        .section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
        .section-header h2 { font-size: 1.25rem; font-weight: 700; }
        .badge-count { background: var(--bg); color: var(--text-secondary); font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 999px; }
        .badge-count.live { background: var(--gain-bg); color: var(--gain-text); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08); }
        .card.live { background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); border-color: #334155; color: #F8FAFC; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .company-info { display: flex; flex-direction: column; gap: 8px; }
        .company-name { font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
        .card.live .company-name { color: #FFFFFF; }
        
        .type-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; width: fit-content; }
        .type-badge.sme { background: var(--sme-bg); color: var(--sme-text); }
        .type-badge.main { background: var(--main-bg); color: var(--main-text); }
        .card.live .type-badge.sme { background: rgba(245, 158, 11, 0.2); color: #FCD34D; }
        .card.live .type-badge.main { background: rgba(59, 130, 246, 0.2); color: #93C5FD; }

        .gain-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; white-space: nowrap; }
        .gain-badge.up { background: var(--gain-bg); color: var(--gain-text); }
        .gain-badge.down { background: var(--loss-bg); color: var(--loss-text); }
        .gain-badge.na { background: var(--bg); color: var(--text-secondary); }

        .live-badge { display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); color: #34D399; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
        .live-badge::before { content: ''; width: 8px; height: 8px; background: #10B981; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        .price-section { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px dashed var(--border); padding-bottom: 1.25rem; }
        .card.live .price-section { border-bottom-color: #334155; }
        .ltp { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.02em; }
        .card.live .ltp { color: #38BDF8; }
        .issue-info { display: flex; flex-direction: column; }
        .issue-label { font-size: 0.75rem; color: var(--text-secondary); font-weight: 500; }
        .card.live .issue-label { color: #94A3B8; }
        .issue-val { font-size: 1rem; font-weight: 600; color: var(--text-secondary); }
        .card.live .issue-val { color: #CBD5E1; }

        .sub-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .sub-item { background: #F8FAFC; border-radius: 12px; padding: 14px; text-align: center; border: 1px solid transparent; }
        .card.live .sub-item { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
        .sub-label { display: block; font-size: 0.7rem; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .card.live .sub-label { color: #94A3B8; }
        .sub-val { display: block; font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
        .card.live .sub-val { color: #FFFFFF; }
        .sub-item.total { background: #ECFDF5; border-color: #A7F3D0; }
        .sub-item.total .sub-val { color: #065F46; }
        .card.live .sub-item.total { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); }
        .card.live .sub-item.total .sub-val { color: #34D399; }

        .card-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .card.live .card-footer { border-top-color: #334155; color: #94A3B8; }
        .listing-gain { font-weight: 600; color: var(--text-primary); }
        .card.live .listing-gain { color: #E2E8F0; }

        .msg { padding: 1.5rem; color: var(--text-secondary); font-size: 1rem; text-align: center; grid-column: 1 / -1; }
        .error-box { background: #FEE2E2; color: #991B1B; padding: 20px; border-radius: 12px; font-family: monospace; white-space: pre-wrap; margin: 20px 0; border: 1px solid #FECACA; }

        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .ltp { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>IPO Dashboard</h1>
        <div class="upd" id="upd"></div>
    </div>
    <div class="section" id="secLive">
        <div class="section-header"><h2>Live Now</h2><span class="badge-count live" id="liveN">0</span></div>
        <div class="grid" id="liveGrid"></div>
    </div>
    <div class="section" id="secPast">
        <div class="section-header"><h2>Past IPOs</h2><span class="badge-count" id="pastN">0</span></div>
        <div class="grid" id="pastGrid"></div>
    </div>
</div>

<script>
    var DATA_URL = "data.json";
    var data = null;

    function esc(s) { return String(s || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function isNum(v) { return typeof v === "number" && isFinite(v); }
    
    function fmtX(v) {
        if (!isNum(v)) return "–";
        if (v >= 10) return Math.round(v) + "x";
        if (v >= 1) return v.toFixed(1) + "x";
        return v.toFixed(2) + "x";
    }
    
    function fmtPrice(v) {
        if (!isNum(v)) return "–";
        if (v >= 100) return "₹" + Math.round(v).toLocaleString('en-IN');
        return "₹" + v.toFixed(2).replace(/\.?0+$/, "");
    }

    function formatDate(iso) {
        if (!iso) return "–";
        const d = new Date(iso);
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' });
    }

    function liveCard(d) {
        const typeClass = (d.type || "Mainboard").toLowerCase() === "sme" ? "sme" : "main";
        return `<div class="card live">
            <div class="card-header">
                <div class="company-info">
                    <h3 class="company-name">${esc(d.name)}</h3>
                    <span class="type-badge ${typeClass}">${esc(d.type || 'Mainboard')}</span>
                </div>
                <div class="live-badge">LIVE</div>
            </div>
            <div class="price-section">
                <div class="ltp">${fmtPrice(d.current || d.band_high)}</div>
                <div class="issue-info">
                    <span class="issue-label">Issue Price</span>
                    <span class="issue-val">${fmtPrice(d.offer || d.band_high)}</span>
                </div>
            </div>
            <div class="sub-grid">
                <div class="sub-item"><span class="sub-label">QIB</span><span class="sub-val">${fmtX(d.qib)}</span></div>
                <div class="sub-item"><span class="sub-label">HNI</span><span class="sub-val">${fmtX(d.nii)}</span></div>
                <div class="sub-item"><span class="sub-label">Retail</span><span class="sub-val">${fmtX(d.retail)}</span></div>
                <div class="sub-item total"><span class="sub-label">Total</span><span class="sub-val">${fmtX(d.total)}</span></div>
            </div>
            <div class="card-footer">
                <span>Closes: ${formatDate(d.close)}</span>
            </div>
        </div>`;
    }

    function pastCard(d) {
        const typeClass = (d.type || "Mainboard").toLowerCase() === "sme" ? "sme" : "main";
        const gainClass = isNum(d.pl) ? (d.pl >= 0 ? "up" : "down") : "na";
        const gainArrow = isNum(d.pl) ? (d.pl >= 0 ? "▲" : "▼") : "–";
        const gainText = isNum(d.pl) ? (d.pl >= 0 ? "+" : "") + d.pl.toFixed(1) + "%" : "–";
        const listGainText = isNum(d.listing_pl) ? `Listing Gain: ${d.listing_pl >= 0 ? '+' : ''}${d.listing_pl.toFixed(1)}%` : '';

        return `<div class="card">
            <div class="card-header">
                <div class="company-info">
                    <h3 class="company-name">${esc(d.name)}</h3>
                    <span class="type-badge ${typeClass}">${esc(d.type || 'Mainboard')}</span>
                </div>
                <div class="gain-badge ${gainClass}">${gainArrow} ${gainText}</div>
            </div>
            <div class="price-section">
                <div class="ltp">${fmtPrice(d.current)}</div>
                <div class="issue-info">
                    <span class="issue-label">Issue Price</span>
                    <span class="issue-val">${fmtPrice(d.offer)}</span>
                </div>
            </div>
            <div class="sub-grid">
                <div class="sub-item"><span class="sub-label">QIB</span><span class="sub-val">${fmtX(d.qib)}</span></div>
                <div class="sub-item"><span class="sub-label">HNI</span><span class="sub-val">${fmtX(d.nii)}</span></div>
                <div class="sub-item"><span class="sub-label">Retail</span><span class="sub-val">${fmtX(d.retail)}</span></div>
                <div class="sub-item total"><span class="sub-label">Total</span><span class="sub-val">${fmtX(d.total)}</span></div>
            </div>
            <div class="card-footer">
                <span>Listed: ${formatDate(d.listed)}</span>
                ${listGainText ? `<span class="listing-gain">${listGainText}</span>` : ''}
            </div>
        </div>`;
    }

    function render() {
        try {
            if (!data) return;
            document.getElementById("upd").textContent = "Updated: " + formatDate(data.updated);
            document.getElementById("liveN").textContent = data.live.length;
            document.getElementById("pastN").textContent = data.past.length;

            let lh = "";
            for (let i = 0; i < data.live.length; i++) lh += liveCard(data.live[i]);
            document.getElementById("liveGrid").innerHTML = lh || '<div class="msg">No live IPOs.</div>';

            let ph = "";
            for (let i = 0; i < data.past.length; i++) ph += pastCard(data.past[i]);
            document.getElementById("pastGrid").innerHTML = ph || '<div class="msg">No past IPOs.</div>';
        } catch (e) {
            document.body.innerHTML = "<h1 style='color:red; padding:20px;'>Dashboard Rendering Error</h1><div class='error-box'>" + e.message + "\n\n" + e.stack + "</div>";
        }
    }

    function load() {
        var x = new XMLHttpRequest();
        x.open("GET", DATA_URL + "?t=" + new Date().getTime(), true);
        x.onreadystatechange = function () {
            if (x.readyState !== 4) return;
            if (x.status >= 200 && x.status < 300) {
                try { data = JSON.parse(x.responseText); render(); }
                catch (e) { document.body.innerHTML = "<h1 style='color:red; padding:20px;'>Data Error</h1><div class='error-box'>Failed to parse data.json: " + e.message + "</div>"; }
            } else if (!data) { 
                document.body.innerHTML = "<h1 style='color:red; padding:20px;'>Network Error</h1><div class='error-box'>Could not load data.json. Status: " + x.status + "</div>"; 
            }
        };
        x.send();
    }
    load();
    setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
