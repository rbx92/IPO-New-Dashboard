<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IPO Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC; --card-bg: #FFFFFF; --text-primary: #0F172A; --text-secondary: #64748B;
            --border: #E2E8F0; --gain-bg: #DCFCE7; --gain-text: #166534;
            --loss-bg: #FEE2E2; --loss-text: #991B1B; --sme-bg: #FEF3C7; --sme-text: #92400E;
            --main-bg: #E0E7FF; --main-text: #3730A3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-primary); padding: 2rem 1.5rem; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; }
        .header .upd { font-size: 0.875rem; color: var(--text-secondary); }
        
        .section { margin-bottom: 3rem; }
        .section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
        .section-header h2 { font-size: 1.25rem; font-weight: 600; }
        .badge-count { background: #E2E8F0; color: #475569; font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 999px; }
        .badge-count.live { background: #DCFCE7; color: #166534; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }

        /* --- BASE CARD --- */
        .card { border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        /* --- LIVE CARD (Dark Green) --- */
        .card.live { background: #14472B; color: #FFFFFF; border: 1px solid #0F3D22; }
        .card.live .type-badge { background: rgba(255,255,255,0.15); color: #FFFFFF; }
        .card.live .hero-label { color: #A7F3D0; }
        .card.live .progress-bg { background: rgba(255,255,255,0.2); }
        .card.live .legend { color: #D1FAE5; }
        .card.live .footer-text { color: #A7F3D0; }
        .card.live .footer-val { color: #FFFFFF; font-weight: 600; }

        /* --- PAST CARD (White) --- */
        .card.past { background: var(--card-bg); border: 1px solid var(--border); }
        .card.past .type-badge.main { background: var(--main-bg); color: var(--main-text); }
        .card.past .type-badge.sme { background: var(--sme-bg); color: var(--sme-text); }
        .card.past .hero-label { color: var(--text-secondary); }
        .card.past .progress-bg { background: #F1F5F9; }
        .card.past .legend { color: var(--text-secondary); }
        .card.past .footer-text { color: var(--text-secondary); }
        .card.past .footer-val { color: var(--text-primary); font-weight: 600; }

        /* --- CARD ELEMENTS --- */
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .type-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .live-badge { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; color: #34D399; }
        .live-badge::before { content: ''; width: 8px; height: 8px; background: #34D399; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }

        .company-name { font-size: 1.25rem; font-weight: 700; line-height: 1.2; margin-top: 0.5rem; }

        .hero-metric { margin-bottom: 0.5rem; }
        .hero-val { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
        .hero-label { font-size: 0.85rem; font-weight: 500; margin-top: 0.25rem; }

        .breakdown-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        .progress-bg { height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 0.5rem; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        
        /* Gradients matching screenshot */
        .card.live .progress-fill { background: linear-gradient(90deg, #34D399 0%, #FBBF24 100%); }
        .card.past .progress-fill { background: linear-gradient(90deg, #4F46E5 0%, #10B981 100%); }

        .legend { display: flex; gap: 1rem; font-size: 0.75rem; font-weight: 500; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 0.3rem; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
        
        /* Legend Colors */
        .card.live .dot-qib { background: #34D399; } .card.live .dot-nii { background: #2DD4BF; } .card.live .dot-retail { background: #FBBF24; }
        .card.past .dot-qib { background: #4F46E5; } .card.past .dot-nii { background: #3B82F6; } .card.past .dot-retail { background: #10B981; }

        .card-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .card.past .card-footer { border-top-color: var(--border); }

        .gain-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; }
        .gain-badge.up { background: var(--gain-bg); color: var(--gain-text); }
        .gain-badge.down { background: var(--loss-bg); color: var(--loss-text); }

        .msg { padding: 2rem; text-align: center; color: var(--text-secondary); grid-column: 1 / -1; }
        .error-box { background: #FEE2E2; color: #991B1B; padding: 20px; border-radius: 12px; font-family: monospace; margin: 20px 0; }

        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>IPO Dashboard</h1>
        <div class="upd" id="upd"></div>
    </div>
    <div class="section">
        <div class="section-header"><h2>Live Now</h2><span class="badge-count live" id="liveN">0</span></div>
        <div class="grid" id="liveGrid"></div>
    </div>
    <div class="section">
        <div class="section-header"><h2>Past IPOs</h2><span class="badge-count" id="pastN">0</span></div>
        <div class="grid" id="pastGrid"></div>
    </div>
</div>

<script>
    var DATA_URL = "data.json";
    var data = null;

    function esc(s) { return String(s || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function isNum(v) { return typeof v === "number" && isFinite(v); }
    
    function fmtX(v) {
        if (!isNum(v)) return "–";
        if (v >= 10) return Math.round(v) + "x";
        if (v >= 1) return v.toFixed(1) + "x";
        return v.toFixed(2) + "x";
    }
    
    function fmtPrice(v) {
        if (!isNum(v)) return "–";
        if (v >= 100) return "₹" + Math.round(v).toLocaleString('en-IN');
        return "₹" + v.toFixed(2).replace(/\.?0+$/, "");
    }

    function formatDate(iso) {
        if (!iso) return "–";
        const d = new Date(iso);
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function getProgressWidth(qib, nii, retail) {
        // Calculates a visual width based on the highest subscription to prevent overflow
        const max = Math.max(qib || 0, nii || 0, retail || 0, 1);
        const total = (qib || 0) + (nii || 0) + (retail || 0);
        return Math.min(100, (total / (max * 1.5)) * 100);
    }

    function liveCard(d) {
        const typeClass = (d.type || "Mainboard").toLowerCase() === "sme" ? "sme" : "main";
        const qib = d.qib || 0, nii = d.nii || 0, retail = d.retail || 0;
        const width = getProgressWidth(qib, nii, retail);

        return `<div class="card live">
            <div class="card-header">
                <span class="type-badge ${typeClass}">${esc(d.type || 'Mainboard')}</span>
                <div class="live-badge">Live</div>
            </div>
            <div class="company-name">${esc(d.name)}</div>
            <div class="hero-metric">
                <div class="hero-val">${fmtX(d.qib)}</div>
                <div class="hero-label">QIB Subscription</div>
            </div>
            <div>
                <div class="breakdown-header">
                    <span>Subscription Breakdown</span>
                    <span>Total: ${fmtX(d.total)}</span>
                </div>
                <div class="progress-bg"><div class="progress-fill" style="width: ${width}%"></div></div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot dot-qib"></div> QIB ${fmtX(d.qib)}</div>
                    <div class="legend-item"><div class="legend-dot dot-nii"></div> NII ${fmtX(d.nii)}</div>
                    <div class="legend-item"><div class="legend-dot dot-retail"></div> Retail ${fmtX(d.retail)}</div>
                </div>
            </div>
            <div class="card-footer">
                <span class="footer-text">Closes: ${formatDate(d.close)}</span>
                <span class="footer-text">Band: <span class="footer-val">${fmtPrice(d.offer || d.band_high)}</span></span>
            </div>
        </div>`;
    }

    function pastCard(d) {
        const typeClass = (d.type || "Mainboard").toLowerCase() === "sme" ? "sme" : "main";
        const qib = d.qib || 0, nii = d.nii || 0, retail = d.retail || 0;
        const width = getProgressWidth(qib, nii, retail);
        
        const gainClass = isNum(d.pl) ? (d.pl >= 0 ? "up" : "down") : "";
        const gainArrow = isNum(d.pl) ? (d.pl >= 0 ? "▲" : "▼") : "";
        const gainText = isNum(d.pl) ? Math.abs(d.pl).toFixed(0) + "%" : "";

        return `<div class="card past">
            <div class="card-header">
                <span class="type-badge ${typeClass}">${esc(d.type || 'Mainboard')}</span>
            </div>
            <div class="company-name">${esc(d.name)}</div>
            <div class="hero-metric">
                <div class="hero-val">${fmtX(d.qib)}</div>
                <div class="hero-label">QIB Subscription</div>
            </div>
            <div>
                <div class="breakdown-header">
                    <span>Subscription Breakdown</span>
                    <span>Total: ${fmtX(d.total)}</span>
                </div>
                <div class="progress-bg"><div class="progress-fill" style="width: ${width}%"></div></div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot dot-qib"></div> QIB ${fmtX(d.qib)}</div>
                    <div class="legend-item"><div class="legend-dot dot-nii"></div> NII ${fmtX(d.nii)}</div>
                    <div class="legend-item"><div class="legend-dot dot-retail"></div> Retail ${fmtX(d.retail)}</div>
                </div>
            </div>
            <div class="card-footer">
                <span class="footer-text">${fmtPrice(d.offer)} → <span class="footer-val">${fmtPrice(d.current)}</span></span>
                ${gainText ? `<span class="gain-badge ${gainClass}">${gainArrow} ${gainText}</span>` : ''}
            </div>
        </div>`;
    }

    function render() {
        try {
            if (!data) return;
            document.getElementById("upd").textContent = "Updated: " + formatDate(data.updated);
            document.getElementById("liveN").textContent = data.live.length;
            document.getElementById("pastN").textContent = data.past.length;

            let lh = "";
            for (let i = 0; i < data.live.length; i++) lh += liveCard(data.live[i]);
            document.getElementById("liveGrid").innerHTML = lh || '<div class="msg">No live IPOs.</div>';

            let ph = "";
            for (let i = 0; i < data.past.length; i++) ph += pastCard(data.past[i]);
            document.getElementById("pastGrid").innerHTML = ph || '<div class="msg">No past IPOs.</div>';
        } catch (e) {
            document.body.innerHTML = "<h1 style='color:red'>Error</h1><div class='error-box'>" + e.message + "</div>";
        }
    }

    function load() {
        var x = new XMLHttpRequest();
        x.open("GET", DATA_URL + "?t=" + new Date().getTime(), true);
        x.onreadystatechange = function () {
            if (x.readyState !== 4) return;
            if (x.status >= 200 && x.status < 300) {
                try { data = JSON.parse(x.responseText); render(); }
                catch (e) { document.body.innerHTML = "<div class='error-box'>Data Error: " + e.message + "</div>"; }
            }
        };
        x.send();
    }
    load();
    setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
