<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPO receipts</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#E4E0D3;color:#1E1E1E;font-family:"Roboto Mono","Droid Sans Mono",Menlo,Consolas,"Courier New",monospace;font-size:15px;line-height:1.35}
button{font-family:inherit}

.top{padding:20px 24px 4px;overflow:hidden}
.top h1{margin:0;font-size:26px;float:left}
.top .upd{float:right;font-size:13px;color:#6B6B63;line-height:34px}

.panel{background:#FBFAF4;border:2px dashed #1E1E1E;margin:10px 24px 8px;padding:12px 14px 6px}
.grp{display:inline-block;vertical-align:top;margin:0 22px 6px 0}
.lab{display:block;font-size:12px;color:#6B6B63;margin-bottom:4px}
.pill{display:inline-block;min-height:40px;padding:0 14px;margin:0 6px 6px 0;border:2px solid #1E1E1E;background:#FBFAF4;color:#1E1E1E;font-size:15px;border-radius:0;cursor:pointer}
.pill.on{background:#1E1E1E;color:#FBFAF4}
.pill.reset{border-style:dashed}
.count{padding:4px 24px 0;font-size:13px;color:#6B6B63}

.sec{padding:14px 24px 0}
.sec h2{margin:0 0 14px;font-size:19px;padding-bottom:8px;border-bottom:2px dashed #1E1E1E}
.wrap{overflow:hidden}
.rc{display:inline-block;vertical-align:top;width:300px;margin:0 16px 26px 0}
.edge{height:8px;background-repeat:repeat-x;background-size:15px 8px}
.edge.t{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='8'><polygon points='0,8 7.5,0 15,8' fill='%23FBFAF4'/></svg>")}
.edge.b{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='8'><polygon points='0,0 7.5,8 15,0' fill='%23FBFAF4'/></svg>")}
.mute .edge.t{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='8'><polygon points='0,8 7.5,0 15,8' fill='%23D9E3DA'/></svg>")}
.mute .edge.b{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='8'><polygon points='0,0 7.5,8 15,0' fill='%23D9E3DA'/></svg>")}
.paper{background:#FBFAF4;padding:6px 18px 12px}
.mute .paper{background:#D9E3DA;color:#4B5A51}

.kick{text-align:center;font-size:12px;color:#6B6B63;letter-spacing:1px}
.nm{text-align:center;font-size:17px;font-weight:bold;margin-top:6px;line-height:1.25;word-wrap:break-word}
.tp{text-align:center;font-size:13px;margin-top:4px}
.dash{border-top:2px dashed #1E1E1E;margin:12px 0 2px}
.mute .dash{border-top-color:#6F7F72}

.row{margin-top:12px;overflow:hidden}
.rl{float:left;font-size:14px;line-height:28px}
.rv{float:right;font-size:17px;font-weight:bold;line-height:28px}
.rv.hero{font-size:27px}
.track{clear:both;height:26px;background-color:#F0EEE4;background-image:radial-gradient(#8A8A82 0.7px,transparent 0.9px);background-size:4px 4px;position:relative}
.fill{height:26px;background-color:#1E1E1E;background-image:repeating-linear-gradient(90deg,#1E1E1E 0,#1E1E1E 9px,#4A4A46 9px,#4A4A46 10px)}
.nq{position:absolute;left:8px;top:0;line-height:26px;font-size:12px;color:#6B6B63}
.scale{position:relative;height:16px;margin-top:6px;font-size:11px;color:#6B6B63}
.scale span{position:absolute;top:0}

.fr{overflow:hidden;font-size:14px;margin-top:5px}
.fr .a{float:left}
.fr .z{float:right}
.gain{border-top:2px solid #1E1E1E;margin-top:12px;padding-top:8px;overflow:hidden}
.gain .gl{float:left;font-size:14px;font-weight:bold;line-height:36px}
.gain .gv{float:right;font-size:30px;font-weight:bold;line-height:36px}
.gain .gv.s{font-size:20px}
.up{color:#1E7A3E}
.dn{color:#B3261E}
.bc{height:30px;margin-top:14px;background-repeat:no-repeat;background-size:100% 100%;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 268 30' preserveAspectRatio='none'><line x1='0' y1='15' x2='268' y2='15' stroke='%231E1E1E' stroke-width='30' stroke-dasharray='2 3 4 2 1 3 3 2 5 3 2 2 1 4 3 2 4 3 1 2 3 3 2 4 1 3 5 2 2 3 1 3 4 2 3 2 1 4 2 3 3 2 4 1 2 3 5 2 1 3 2 4 3 2 1 3 4 2 2 3 1 5 3 2 4 1 3 2'/></svg>")}

.none{text-align:center;font-size:20px;margin:30px 0 6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#1E1E1E;margin-right:6px;-webkit-animation:blink 1.4s infinite;animation:blink 1.4s infinite}
@-webkit-keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.more{clear:both;text-align:center;padding:4px 0 30px}
.msg{padding:30px 24px;font-size:17px}
.empty{padding:6px 0 24px;font-size:15px;color:#6B6B63}
</style>
</head>
<body>

<div class="top">
  <h1>IPO receipts</h1>
  <div class="upd" id="upd"></div>
</div>
<div class="panel" id="panel"></div>
<div class="count" id="count"></div>
<div id="out"><div class="msg">Loading…</div></div>

<script>
(function () {
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DATA = null;
  var DEFAULTS = { show: 'both', type: 'all', qmin: 0, tmin: 0, res: 'all', sort: 'newest', dir: 'desc', limit: 30 };
  var S = {};
  var k;
  for (k in DEFAULTS) { S[k] = DEFAULTS[k]; }

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function isNum(v) { return v !== null && v !== undefined && !isNaN(v); }
  function trim0(s) {
    if (s.indexOf('.') > -1) { s = s.replace(/0+$/, '').replace(/\.$/, ''); }
    return s;
  }
  function mult(v) {
    if (!isNum(v)) { return '–'; }
    var d = v >= 100 ? 0 : (v >= 10 ? 1 : 2);
    return trim0(v.toFixed(d)) + '×';
  }
  function pos(v) {
    if (!isNum(v) || v <= 1) { return 2; }
    var p = Math.log(v) / Math.LN10 / 3 * 100;
    return p > 100 ? 100 : (p < 2 ? 2 : p);
  }
  function inr(v) {
    if (!isNum(v)) { return '–'; }
    var parts = Math.abs(v).toFixed(2).split('.');
    var ip = parts[0];
    if (ip.length > 3) {
      var last = ip.slice(-3);
      var rest = ip.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      ip = rest + ',' + last;
    }
    var dec = trim0('0.' + parts[1]).replace('0', '').replace(/^\./, '');
    return '₹' + ip + (dec ? '.' + dec : '');
  }
  function dshort(s) {
    if (!s) { return '–'; }
    var p = s.split('-');
    return parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1];
  }
  function dfull(s) {
    if (!s) { return '–'; }
    return dshort(s) + ' ' + s.split('-')[0];
  }
  function todayStr() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function band(it) {
    if (!isNum(it.band_low) && !isNum(it.band_high)) { return '–'; }
    if (it.band_low === it.band_high || !isNum(it.band_low)) { return inr(it.band_high); }
    if (!isNum(it.band_high)) { return inr(it.band_low); }
    return inr(it.band_low) + '–' + inr(it.band_high).replace('₹', '');
  }
  function noFigures(it) {
    return !isNum(it.qib) && !isNum(it.nii) && !isNum(it.retail) && !isNum(it.total);
  }
  function noQib(it) {
    return it.type === 'SME' && (!isNum(it.qib) || it.qib === 0) && isNum(it.total);
  }

  /* ---------- card pieces ---------- */
  function bar(label, v, hero, extraNote) {
    var h = '<div class="row"><div class="rl">' + label + '</div><div class="rv' + (hero ? ' hero' : '') + '">' + mult(v) + '</div></div>';
    if (extraNote) {
      h += '<div class="track"><span class="nq">' + extraNote + '</span></div>';
    } else {
      h += '<div class="track"><div class="fill" style="width:' + (isNum(v) ? pos(v) : 0) + '%"></div></div>';
    }
    return h;
  }
  function bars(it) {
    var nq = noQib(it);
    var h = '';
    h += nq ? bar('QIB', null, false, 'No QIB') : bar('QIB', it.qib, true);
    h += bar('NII', it.nii, false);
    h += bar('Retail', it.retail, false);
    h += bar('Total', it.total, nq);
    h += '<div class="scale"><span style="left:0">1×</span><span style="left:30%">10×</span><span style="left:63%">100×</span><span style="right:0">1000×</span></div>';
    return h;
  }
  function wrapCard(inner, mute) {
    return '<div class="rc' + (mute ? ' mute' : '') + '"><div class="edge t"></div><div class="paper">' + inner + '</div><div class="edge b"></div></div>';
  }
  function head(kick, it) {
    return '<div class="kick">' + kick + '</div><div class="nm">' + esc(it.name) + '</div><div class="tp">[ ' + esc(it.type) + ' ]</div><div class="dash"></div>';
  }

  function pastCard(it) {
    var up = isNum(it.pl) && it.pl >= 0;
    var g = isNum(it.pl) ? ((up ? '+' : '−') + Math.round(Math.abs(it.pl)) + '%') : '–';
    var h = head('Listed ' + dfull(it.listed), it) + bars(it);
    h += '<div class="dash"></div>';
    h += '<div class="fr"><span class="a">Issue</span><span class="z">' + inr(it.offer) + '</span></div>';
    h += '<div class="fr"><span class="a">Now</span><span class="z">' + inr(it.current) + '</span></div>';
    h += '<div class="gain"><span class="gl">Gain</span><span class="gv ' + (isNum(it.pl) ? (up ? 'up' : 'dn') : '') + '">' + g + '</span></div>';
    h += '<div class="bc"></div>';
    return wrapCard(h, false);
  }

  function liveCard(it, today) {
    var open = it.close && it.close >= today;
    if (noFigures(it)) {
      var m = head('Awaiting figures', it);
      m += '<div class="none">No figures yet</div><div class="dash"></div>';
      m += '<div class="fr"><span class="a">' + (open ? 'Closes' : 'Closed') + '</span><span class="z">' + dshort(it.close) + '</span></div>';
      m += '<div class="fr"><span class="a">Band</span><span class="z">' + band(it) + '</span></div>';
      m += '<div class="gain" style="border-top-color:#6F7F72"><span class="gl">Status</span><span class="gv s">Awaiting</span></div>';
      return wrapCard(m, true);
    }
    var kick = open ? '<span class="dot"></span>Live, closes ' + dshort(it.close) : 'Closed ' + dshort(it.close);
    var h = head(kick, it) + bars(it);
    h += '<div class="dash"></div>';
    h += '<div class="fr"><span class="a">' + (open ? 'Closes' : 'Closed') + '</span><span class="z">' + dshort(it.close) + '</span></div>';
    h += '<div class="fr"><span class="a">Band</span><span class="z">' + band(it) + '</span></div>';
    h += '<div class="gain"><span class="gl">Status</span><span class="gv s">' + (open ? 'Live now' : 'Listing soon') + '</span></div>';
    h += '<div class="bc"></div>';
    return wrapCard(h, false);
  }

  /* ---------- filter and sort ---------- */
  function passes(it, kind) {
    if (S.type !== 'all' && it.type !== S.type) { return false; }
    if (S.qmin > 0 && !(isNum(it.qib) && it.qib >= S.qmin)) { return false; }
    if (S.tmin > 0 && !(isNum(it.total) && it.total >= S.tmin)) { return false; }
    if (kind === 'past') {
      if (S.res === 'gain' && !(isNum(it.pl) && it.pl > 0)) { return false; }
      if (S.res === 'loss' && !(isNum(it.pl) && it.pl < 0)) { return false; }
    }
    return true;
  }
  function keyOf(it, kind) {
    if (S.sort === 'newest') { return kind === 'past' ? it.listed : it.close; }
    if (S.sort === 'gain') { return kind === 'past' && isNum(it.pl) ? it.pl : null; }
    return isNum(it[S.sort]) ? it[S.sort] : null;
  }
  function sorted(list, kind) {
    var arr = [];
    var i;
    for (i = 0; i < list.length; i++) { if (passes(list[i], kind)) { arr.push(list[i]); } }
    arr.sort(function (a, b) {
      var ka = keyOf(a, kind), kb = keyOf(b, kind);
      var ma = (ka === null || ka === undefined), mb = (kb === null || kb === undefined);
      if (ma && mb) { return a.name < b.name ? -1 : 1; }
      if (ma) { return 1; }
      if (mb) { return -1; }
      if (ka === kb) { return a.name < b.name ? -1 : 1; }
      var r = ka < kb ? -1 : 1;
      return S.dir === 'desc' ? -r : r;
    });
    return arr;
  }

  /* ---------- controls ---------- */
  function ctl() {
    var newest = S.sort === 'newest';
    return [
      { k: 'show', label: 'Show', o: [['live', 'Live'], ['past', 'Past'], ['both', 'Both']] },
      { k: 'type', label: 'Type', o: [['all', 'All'], ['Mainboard', 'Mainboard'], ['SME', 'SME']] },
      { k: 'qmin', label: 'QIB at least', o: [[0, 'Any'], [10, '10×'], [30, '30×'], [100, '100×']] },
      { k: 'tmin', label: 'Total at least', o: [[0, 'Any'], [10, '10×'], [30, '30×'], [100, '100×']] },
      { k: 'res', label: 'Past result', o: [['all', 'All'], ['gain', 'Gainers'], ['loss', 'Losers']] },
      { k: 'sort', label: 'Sort by', o: [['newest', 'Newest'], ['qib', 'QIB'], ['nii', 'NII'], ['retail', 'Retail'], ['total', 'Total'], ['gain', 'Gain']] },
      { k: 'dir', label: 'Order', o: [['desc', newest ? 'Newest first' : 'High to low'], ['asc', newest ? 'Oldest first' : 'Low to high']] }
    ];
  }
  function drawPanel() {
    var c = ctl(), h = '', i, j;
    for (i = 0; i < c.length; i++) {
      h += '<div class="grp"><span class="lab">' + c[i].label + '</span>';
      for (j = 0; j < c[i].o.length; j++) {
        var on = String(S[c[i].k]) === String(c[i].o[j][0]);
        h += '<button type="button" class="pill' + (on ? ' on' : '') + '" data-k="' + c[i].k + '" data-v="' + c[i].o[j][0] + '">' + c[i].o[j][1] + '</button>';
      }
      h += '</div>';
    }
    h += '<div class="grp"><span class="lab">&nbsp;</span><button type="button" class="pill reset" data-k="reset" data-v="1">Reset</button></div>';
    document.getElementById('panel').innerHTML = h;
  }

  /* ---------- page ---------- */
  function draw() {
    if (!DATA) { return; }
    drawPanel();
    var today = todayStr();
    var out = '';
    var counts = [];

    if (S.show !== 'past') {
      var lv = sorted(DATA.live || [], 'live');
      out += '<div class="sec"><h2>Live now, ' + lv.length + ' of ' + (DATA.live || []).length + '</h2><div class="wrap">';
      var i;
      for (i = 0; i < lv.length; i++) { out += liveCard(lv[i], today); }
      out += '</div>';
      if (!lv.length) { out += '<div class="empty">Nothing matches these filters.</div>'; }
      out += '</div>';
      counts.push(lv.length + ' live');
    }
    if (S.show !== 'live') {
      var ps = sorted(DATA.past || [], 'past');
      var shown = ps.slice(0, S.limit);
      out += '<div class="sec"><h2>Past IPOs, ' + ps.length + ' of ' + (DATA.past || []).length + '</h2><div class="wrap">';
      var j;
      for (j = 0; j < shown.length; j++) { out += pastCard(shown[j]); }
      out += '</div>';
      if (!ps.length) { out += '<div class="empty">Nothing matches these filters.</div>'; }
      if (ps.length > shown.length) {
        out += '<div class="more"><button type="button" class="pill" data-k="more" data-v="1">Show 30 more</button></div>';
      }
      out += '</div>';
      counts.push(ps.length + ' past');
    }
    document.getElementById('out').innerHTML = out;
    document.getElementById('count').innerHTML = 'Matching: ' + counts.join(', ');
  }

  document.addEventListener('click', function (e) {
    var t = e.target || e.srcElement;
    while (t && t !== document && !(t.getAttribute && t.getAttribute('data-k'))) { t = t.parentNode; }
    if (!t || t === document) { return; }
    var key = t.getAttribute('data-k'), val = t.getAttribute('data-v');
    if (key === 'reset') {
      var q;
      for (q in DEFAULTS) { S[q] = DEFAULTS[q]; }
    } else if (key === 'more') {
      S.limit += 30;
    } else {
      S[key] = (key === 'qmin' || key === 'tmin') ? parseFloat(val) : val;
      S.limit = DEFAULTS.limit;
    }
    draw();
  });

  /* ---------- load ---------- */
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'data.json?t=' + new Date().getTime(), true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) { return; }
    if (xhr.status >= 200 && xhr.status < 300) {
      try {
        DATA = JSON.parse(xhr.responseText);
      } catch (err) {
        document.getElementById('out').innerHTML = '<div class="msg">data.json could not be read. Check that the file is valid.</div>';
        return;
      }
      document.getElementById('upd').innerHTML = DATA.updated ? 'Updated ' + dfull(DATA.updated) : '';
      draw();
    } else {
      document.getElementById('out').innerHTML = '<div class="msg">data.json could not be loaded. Check that it sits next to index.html.</div>';
    }
  };
  xhr.send();
})();
</script>
</body>
</html>
