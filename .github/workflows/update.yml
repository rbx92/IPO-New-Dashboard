name: Update IPO data

on:
  schedule:
    - cron: "30 14 * * *"   # 20:00 India time, every day
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install requests beautifulsoup4
      - name: Fetch and update data
        run: python update_data.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "ipo-bot"
            git config user.email "ipo-bot@users.noreply.github.com"
            git add data.json
            git commit -m "Update IPO data"
            git push
          else
            echo "No changes"
          fi
