name: Update IPO Data

on:
  schedule:
    - cron: '0 14 * * *'  # Runs daily at 7:30 PM IST
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Run update script
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "IPO-Bot"
          git config --global user.email "bot@github.com"
          git add data.json "IPO - Self Populated.xlsx"
          git commit -m "Auto-update: Refreshed IPO data and prices" || echo "No changes to commit"
          git push
